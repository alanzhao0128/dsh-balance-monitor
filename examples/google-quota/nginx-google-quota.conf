# Put inside your CPA `server { ... }` block (see the README for the full server block).
# Needs this once at http{} level:   limit_req_zone $binary_remote_addr zone=cpa_mgmt:10m rate=30r/m;
#
# An exact-match location does NOT inherit auth_basic from any sibling location - it must be repeated here.
location = /v0/google/quota {
    auth_basic "CPA quota";
    auth_basic_user_file /etc/nginx/.htpasswd-cpa;
    limit_req zone=cpa_mgmt burst=10 nodelay;
    default_type application/json;
    alias /var/www/cpa-static/google-quota-cache.json;
}
